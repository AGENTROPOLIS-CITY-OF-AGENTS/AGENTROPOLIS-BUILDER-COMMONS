name: Deploy Builder Commons Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/site _site/packages/design-system _site/docs
          cp index.html _site/index.html
          cp site/styles.css _site/site/styles.css
          cp site/app.mjs _site/site/app.mjs
          cp packages/design-system/tokens.css _site/packages/design-system/tokens.css
          cp docs/ROADMAP.md _site/docs/ROADMAP.md
          cp CONTRIBUTING.md _site/CONTRIBUTING.md
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/site/styles.css
          test -s _site/site/app.mjs
          tar --dereference --hard-dereference --directory "_site" -cvf "$RUNNER_TEMP/artifact.tar" .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
